; Isolated tach-only build: v1.1.0 (the version actually flashed on the board) plus the
; robust-tach changes from ticket 0007, and nothing else. Flashing this verifies the tach
; fix without also introducing load-cell auto-scale, which would require a re-TARE and a
; SETCAL per gain with known weights at the rig.
;   pio run -e seeed-xiao-rp2040-tach-v111 [--target upload]
[env:seeed-xiao-rp2040-tach-v111]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_tach_v111/>
